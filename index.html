<!DOCTYPE html>
<html>
<head>
    <title>Emil Chiller Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <h1>Chiller Control</h1>
    <button onclick="toggleChiller()">START/STOP</button>
    <div id="status">Loading...</div>
    <div id="temp">Temp: --.- °C</div>
    
    <script>
        // Firebase config
        const firebaseConfig = {
            databaseURL: "https://your-project.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        function toggleChiller() {
            db.ref('chiller/start').set(1);
        }
        
        db.ref('chiller/status').on('value', (snapshot) => {
            document.getElementById('status').innerText = 
                snapshot.val() ? "RUNNING" : "STOPPED";
        });
        
        db.ref('chiller/vin').on('value', (snapshot) => {
            document.getElementById('temp').innerText = 
                "Water In: " + snapshot.val() + " °C";
        });
    </script>
</body>
</html>
