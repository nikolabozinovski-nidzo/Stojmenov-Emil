<div class="scada-layout">
    <!-- Evaporator -->
    <div class="component evaporator">
        <div class="comp-title">Evaporator</div>
        <div class="readout">Water In: <span id="vIn">--.-</span></div>
        <div class="readout">Water Out: <span id="vOut">--.-</span></div>
        <div class="readout">Sensor A: <span id="evA">--.-</span></div>
        <div class="readout">Sensor B: <span id="evB">--.-</span></div>
    </div>

    <!-- Compressor 1 -->
    <div class="component compressor">
        <div class="comp-title">Compressor 1</div>
        <div class="readout">Pressure: <span id="p1">--.0</span> bar</div>
        <div class="readout">Temperature: <span id="t1">--.0</span> °C</div>
    </div>

    <!-- Compressor 2 -->
    <div class="component compressor">
        <div class="comp-title">Compressor 2</div>
        <div class="readout">Pressure: <span id="p2">--.0</span> bar</div>
        <div class="readout">Temperature: <span id="t2">--.0</span> °C</div>
    </div>

    <!-- Condenser -->
    <div class="component condenser">
        <div class="comp-title">Condenser</div>
        <div class="readout">Sensor A: <span id="cnA">--.-</span></div>
        <div class="readout">Sensor B: <span id="cnB">--.-</span></div>
    </div>

    <!-- Water Circuit -->
    <div class="component water-circuit">
        <div class="comp-title">Water Circuit</div>
        <div class="readout">Flow Rate: <span id="flowRate">--.0</span> L/min</div>
    </div>
</div>
